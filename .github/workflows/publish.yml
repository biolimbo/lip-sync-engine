name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored in the
# repository. The package's trusted publisher on npmjs.com must name this
# repository and the workflow file `publish.yml`.
#
# - Tag `vX.Y.Z` publishes X.Y.Z under the `latest` dist-tag. package.json
#   must already say X.Y.Z.
# - Tag `vX.Y.Z-rc.N` (any prerelease) publishes under the `next` dist-tag,
#   so `npm install lip-sync-engine` keeps getting the last stable release.
#   package.json may say X.Y.Z; the prerelease version is applied in CI only.
# - Every tag also gets a GitHub release with its CHANGELOG.md section as the
#   notes (scripts/release-notes.mjs). Prerelease tags get a GitHub prerelease.
# - Manual run (Actions tab, "Run workflow"): builds, tests and runs
#   `npm publish --dry-run`. Untick "dry run" to publish package.json's
#   version for real.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build, test and pack, do not publish)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@^11.5.1

      - name: Resolve version and dist-tag
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$pkg"
          fi
          base="${version%%-*}"
          if [ "$version" != "$pkg" ]; then
            if [ "$version" = "$base" ] || [ "$base" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
              exit 1
            fi
            npm version "$version" --no-git-tag-version
          fi
          if [ "$version" = "$base" ]; then dist_tag=latest; else dist_tag=next; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under the '$dist_tag' dist-tag"

      # Checked before publishing, so a missing CHANGELOG section stops the
      # release before anything reaches npm.
      - name: Prepare release notes
        if: github.ref_type == 'tag'
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:wasm

      - name: Build TypeScript
        run: npm run build:ts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # --ignore-scripts: the package was built above, so skip prepublishOnly's
      # second clean build.
      - name: Publish to npm
        run: |
          flags="--access public --tag $DIST_TAG --ignore-scripts"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          npm publish $flags
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          flags="--verify-tag --title $GITHUB_REF_NAME --notes-file $RUNNER_TEMP/release-notes.md"
          if [ "$DIST_TAG" = "latest" ]; then flags="$flags --latest"; else flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $flags
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
